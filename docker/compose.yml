# omnisense/omnisign with every gateway package:
#
#   cp .env.dist .env                                          # a provider's keys, a DocuSeal instance, when you have them
#   docker compose run --rm omnisign gateways                  # which gateways are installed and configured, what each offers and does
#   docker compose run --rm omnisign bare                      # plain PHP: no bundle, no container, the providers' recorded answers, and what PHP loaded
#   docker compose run --rm omnisign bare --live               # the same against DOCUSEAL_URL, for real
#   docker compose run --rm omnisign test                      # every package's tests
#
# Gateways come from GitHub (branch 1.x) unless their checkout sits under
# OMNISIGN_PLUGINS (set it to ../.. in .env when this core sits in the
# workspace beside them): then that checkout is what runs.
# omnisense/contracts likewise: its checkout under OMNISENSE_CONTRACTS (../../../omnisense-contracts
# in .env when it sits beside the family's folder), its tests run with the family's; GitHub otherwise.
name: omnisign-harness

services:
  omnisign:
    build: .
    image: omnisense/omnisign-harness
    # The image may be another family's harness tagged (the same PHP 8.4 Alpine with Composer): the
    # entrypoint is named here, not taken from the image.
    entrypoint: ["/omnisign/core/docker/entrypoint.sh"]
    # One service, no server beside it: Docker's default bridge, no network of its own to create.
    network_mode: bridge
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omnisign/core
      - ${OMNISIGN_PLUGINS:-./plugins}:/omnisign/plugins:ro
      - ${OMNISENSE_CONTRACTS:-./contracts}:/omnisense/contracts:ro
      - harness:/harness

volumes:
  harness:
